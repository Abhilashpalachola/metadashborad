<style>
:root { --blue: #1FA6B5; --sky: #5AA5FF; --ink: #242424; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAFBFB; color: var(--ink); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; padding: 16px; }
.box { width: 100%; max-width: 380px; background: #fff; border-top: 3px solid var(--blue); border-radius: 4px; padding: 36px 32px; box-shadow: 0 8px 30px rgba(36,36,36,.08); }
img { height: 40px; display: block; margin-bottom: 28px; }
.eb { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--sky); font-weight: 500; }
h1 { font-weight: 300; font-size: 1.7rem; color: var(--sky); margin: 6px 0 24px; letter-spacing: -.01em; }
label { font-size: .8rem; color: #6B7378; display: block; margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 12px; border: 1px solid #D9DEE1; border-radius: 4px; }
input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
button { margin-top: 16px; width: 100%; font: inherit; font-weight: 500; padding: 12px; background: var(--ink); color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
button:hover { background: var(--blue); }
.err { color: #D14343; font-size: .85rem; min-height: 1.2em; margin-top: 12px; }
</style></head>

<div class="eb">Lead generation</div><h1>Meta lead command centre</h1>
<label for="pw">Team password</label>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<button id="go" type="button">Sign in</button>
<div class="err" id="err"></div>
</div>
<script>
// No team password set on the site: go straight to the dashboard.
fetch('/api/login').then((r) => r.json()).then((b) => { if (b && b.open) location.replace('/'); }).catch(() => {});
const go = async () => {
  const err = document.getElementById('err'); err.textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) }).catch(() => null);
  if (r && r.ok) { location.href = '/'; return; }
  const b = r ? await r.json().catch(() => ({})) : {};
  err.textContent = b.error || 'Could not sign in.';
};
document.getElementById('go').addEventListener('click', go);
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
</script>
</body></html>
